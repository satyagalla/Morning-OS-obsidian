# Absolute path to your Obsidian vault root
vault_path: "D:/Productivity/OS"

# Relative to vault_path — where the agent writes daily brief JSONs
output_dir: "_generated/briefs"

# Relative to vault_path — where feedback and reaction JSONs are written
feedback_dir: "_generated/feedback"

# ── LLM configuration ──────────────────────────────────────────────────────
# Two slots: intelligence (main briefing call) and fallback (markdown parse recovery).
# Swap provider names to switch backends. Supported: bedrock, ollama, openai, gemini, groq.
llm:
  intelligence:
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6
    region: us-east-2
  fallback:
    # Local model used when markdown parsing yields no tasks/goals
    provider: ollama
    model: qwen2.5:7b
    base_url: http://localhost:11434

# ── Field configuration ─────────────────────────────────────────────────────
# mode: llm   → assembler uses LLM output for this field
# mode: direct → assembler uses raw parsed markdown, no LLM involvement
# count        → how many items to include in the brief (and how many the LLM is asked to pick)
fields:
  tactical_rules:
    mode: llm      # LLM picks the most relevant rules for today's tasks
    count: 4       # number of rules shown in the brief

  identity_rules:
    mode: llm      # LLM picks identity affirmations resonant with today's situation
    count: 3       # number of identity pills shown in the strip

  goals:
    mode: llm      # goals passed verbatim through LLM (no rephrasing — see prompts.py)

  hobby_tasks:
    mode: llm      # LLM picks from Hobby Tasks.md — verbatim, no generation
    count: 3       # number of hobby pills shown

  suggestion:
    mode: llm      # only field where LLM generates new text
    count: 3       # number of suggestion cards shown (each gets a 👍/👎)

  technical_tasks:
    mode: direct   # top N items from Technical Tasks.md, no LLM involvement
    count: 5       # how many appear in the Pending Tasks hover panel

  tasks:
    mode: direct   # red alert + regular tasks read straight from today's daily note

  wins:
    mode: direct   # wins read from daily note; user can also add via plugin UI

# ── Vault source file paths (relative to vault_path) ───────────────────────
sources:
  daily_note: "Essential/Daily/{date}.md"        # {date} replaced with YYYY-MM-DD
  tactical_rules: "Essential/State of Mind/Tactical Rules.md"
  emotional_rules: "Essential/State of Mind/Emotional Rules.md"
  goals: "Essential/State of Mind/Long-term and Short-term.md"
  technical_tasks: "Essential/Pending Tasks/Technical Tasks.md"
  hobby_tasks: "Essential/Pending Tasks/Hobby Tasks.md"

# ── Section header names inside the daily note ─────────────────────────────
# Must match the ## headings used in YYYY-MM-DD.md exactly (case-insensitive)
daily_note_sections:
  red_alert: "Red alert"
  regular: "Regular"
  thoughts: "Thoughts"
  pending: "Top 3 pending"
  wins: "Wins"

# ── Section header names inside the goals file ─────────────────────────────
goals_sections:
  short_term: "Short Term"
  long_term: "Long Term"
